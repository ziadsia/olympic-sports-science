<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطالب - الأكاديمية الأولمبية لعلوم الرياضة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
    }
    .announcement-bar {
      background: #0284c7;
      color: #ffffff;
      padding: 10px 16px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .student-header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 22px;
    }
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }
    .course-card {
      padding: 20px;
      border-radius: 14px;
      background: var(--card-bg, #ffffff);
      border: 1px solid rgba(2, 132, 199, 0.16);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .course-card.locked {
      border-color: rgba(100, 116, 139, 0.28);
    }
    .course-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .course-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(2, 132, 199, 0.1);
      color: #0284c7;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .lock-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .lock-pill.is-locked {
      background: rgba(239, 68, 68, 0.12);
      color: #dc2626;
    }
    .lock-pill.is-unlocked {
      background: rgba(16, 185, 129, 0.14);
      color: #059669;
    }

    /* نافذة إدخال كود التفعيل */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg, #ffffff);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid rgba(2, 132, 199, 0.22);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 14px;
    }
  </style>
</head>
<body id="studentBody" style="display:none;">
  <div id="announcementBar" class="announcement-bar" data-vis="announcementBanner" style="display:none;"></div>

  <header class="navbar">
    <div class="container nav-content">
      <a href="dashboard.html" class="brand">
        <img id="siteLogo" src="assets/img/logo.png" alt="شعار الأكاديمية" class="brand-logo" onerror="this.style.display='none'" />
        <span>الأكاديمية الأولمبية لعلوم الرياضة</span>
      </a>
      <div class="nav-actions">
        <button id="themeToggle" class="btn btn-icon" type="button" title="تبديل الوضع">🌙</button>
        <button id="logoutBtn" class="btn btn-outline" type="button">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="container section" style="padding-top: 28px;">
    <div class="card student-header-card">
      <div>
        <h1 style="margin:0 0 4px; font-size:1.35rem; color:#0284c7;">
          مرحباً بك، <span id="studentName">طالب</span>
        </h1>
        <small id="studentEmail" style="opacity:0.75;"></small>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="badge" style="margin:0;">حساب طالب</span>
      </div>
    </div>

    <section id="coursesSection" data-vis="coursesSection">
      <h2 class="section-title">جميع الكورسات</h2>
      <div id="dashboardCoursesGrid" class="courses-grid">
        <p style="opacity:0.75;">جاري تحميل الكورسات...</p>
      </div>
    </section>
  </main>

  <!-- مودال إدخال كود التفعيل -->
  <div id="unlockModal" class="modal-backdrop">
    <div class="modal-box">
      <h3 style="margin:0 0 6px; color:#0284c7;">🔒 فتح الكورس بكود التفعيل</h3>
      <p id="modalCourseTitle" style="margin:0 0 14px; font-weight:700; opacity:0.85;"></p>

      <form id="unlockCourseForm">
        <div class="form-group">
          <label>أدخل كود التفعيل</label>
          <input type="text" id="activationCodeInput" class="form-control" placeholder="مثال: OLY-XXXXXX" required style="text-transform:uppercase;" />
        </div>
        <p id="unlockErrorMsg" style="color:#dc2626; font-weight:700; min-height:22px; margin:6px 0 0;"></p>
        <div class="modal-actions">
          <button type="button" id="closeModalBtn" class="btn btn-outline">إلغاء</button>
          <button type="submit" id="confirmUnlockBtn" class="btn btn-primary">تفعيل وفتح الكورس</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initTheme } from "./assets/js/theme.js";
    import { auth, db } from "./assets/js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      collection, getDocs, doc, getDoc, updateDoc, arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    initTheme();

    // تحميل اللوجو وإعدادات الظهور
    const logoEl = document.getElementById("siteLogo");
    try {
      const brandSnap = await getDoc(doc(db, "settings", "branding"));
      if (brandSnap.exists() && brandSnap.data().logoUrl) {
        logoEl.src = brandSnap.data().logoUrl;
        logoEl.style.display = "inline-block";
      }
    } catch (e) {}

    try {
      const visSnap = await getDoc(doc(db, "settings", "visibility"));
      if (visSnap.exists()) {
        const cfg = visSnap.data();
        document.querySelectorAll("[data-vis]").forEach((el) => {
          const key = el.getAttribute("data-vis");
          if (key === "announcementBanner") {
            if (cfg.announcementBanner && cfg.announcementText) {
              el.textContent = cfg.announcementText;
              el.style.display = "block";
            } else {
              el.style.display = "none";
            }
          } else if (cfg[key] === false) {
            el.style.display = "none";
          }
        });
      }
    } catch (e) {}

    let currentUser = null;
    let enrolledSet = new Set();
    let selectedCourse = null;

    const modal = document.getElementById("unlockModal");
    const modalCourseTitle = document.getElementById("modalCourseTitle");
    const codeInput = document.getElementById("activationCodeInput");
    const unlockErrorMsg = document.getElementById("unlockErrorMsg");

    function openUnlockModal(course) {
      selectedCourse = course;
      modalCourseTitle.textContent = `الكورس: ${course.title}`;
      codeInput.value = "";
      unlockErrorMsg.textContent = "";
      modal.classList.add("open");
      codeInput.focus();
    }

    function closeUnlockModal() {
      modal.classList.remove("open");
      selectedCourse = null;
    }

    document.getElementById("closeModalBtn").addEventListener("click", closeUnlockModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeUnlockModal();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.href = "auth.html";
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = "auth.html";
        return;
      }
      currentUser = user;

      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      const userData = userSnap.exists() ? userSnap.data() : {};

      document.getElementById("studentName").textContent = userData.fullName || user.email?.split("@")[0] || "طالب";
      document.getElementById("studentEmail").textContent = user.email || "";

      const list = Array.isArray(userData.enrolledCourses) ? userData.enrolledCourses : [];
      enrolledSet = new Set(list);

      document.getElementById("studentBody").style.display = "block";
      await renderAllCourses();
    });

    async function renderAllCourses() {
      const grid = document.getElementById("dashboardCoursesGrid");
      const snap = await getDocs(collection(db, "courses"));

      if (snap.empty) {
        grid.innerHTML = `<p style="opacity:0.75;">لا توجد كورسات متاحة حالياً.</p>`;
        return;
      }

      grid.innerHTML = "";
      snap.forEach((docSnap) => {
        const course = { id: docSnap.id, ...docSnap.data() };
        const isUnlocked = enrolledSet.has(course.id);

        const card = document.createElement("div");
        card.className = `course-card ${isUnlocked ? "unlocked" : "locked"}`;
        card.innerHTML = `
          <div>
            <div class="course-top-row">
              <span class="course-badge">${course.category || "علوم الرياضة"}</span>
              <span class="lock-pill ${isUnlocked ? "is-unlocked" : "is-locked"}">
                ${isUnlocked ? "🔓 مفتوح" : "🔒 مقفول"}
              </span>
            </div>
            <h3 style="margin:0 0 8px;">${course.title || "كورس"}</h3>
            <p style="margin:0; opacity:0.82; line-height:1.6;">${course.description || ""}</p>
          </div>

          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:12px; border-top:1px solid rgba(2,132,199,0.1);">
            <span style="font-weight:800; color:#0284c7;">${course.price || ""}</span>
            ${
              isUnlocked
                ? `<a href="course.html?id=${encodeURIComponent(course.id)}" class="btn btn-primary">دخول الكورس</a>`
                : `<button type="button" class="btn btn-outline unlock-btn">🔒 فتح بكود التفعيل</button>`
            }
          </div>
        `;

        if (!isUnlocked) {
          card.querySelector(".unlock-btn").addEventListener("click", () => openUnlockModal(course));
        }

        grid.appendChild(card);
      });
    }

    document.getElementById("unlockCourseForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!selectedCourse || !currentUser) return;

      const enteredCode = codeInput.value.trim().toUpperCase();
      if (!enteredCode) return;

      unlockErrorMsg.textContent = "";
      const confirmBtn = document.getElementById("confirmUnlockBtn");
      confirmBtn.disabled = true;

      try {
        const codeRef = doc(db, "activation_codes", enteredCode);
        const codeSnap = await getDoc(codeRef);

        if (!codeSnap.exists()) {
          unlockErrorMsg.textContent = "كود التفعيل غير صحيح.";
          confirmBtn.disabled = false;
          return;
        }

        const codeData = codeSnap.data();

        if (codeData.used) {
          unlockErrorMsg.textContent = "هذا الكود تم استخدامه من قبل.";
          confirmBtn.disabled = false;
          return;
        }

        if (codeData.courseId && codeData.courseId !== selectedCourse.id) {
          unlockErrorMsg.textContent = "هذا الكود مخصص لكورس آخر وليس هذا الكورس.";
          confirmBtn.disabled = false;
          return;
        }

        // تعليم الكود كمستخدم وربطه بالطالب
        await updateDoc(codeRef, {
          used: true,
          usedBy: currentUser.uid,
          usedAt: new Date().toISOString()
        });

        // إضافة الكورس لقائمة كورسات الطالب المفعّلة
        await updateDoc(doc(db, "users", currentUser.uid), {
          enrolledCourses: arrayUnion(selectedCourse.id)
        });

        enrolledSet.add(selectedCourse.id);
        const targetCourseId = selectedCourse.id;
        closeUnlockModal();
        await renderAllCourses();

        // توجيه مباشر للكورس بعد الفتح
        location.href = `course.html?id=${encodeURIComponent(targetCourseId)}`;
      } catch (err) {
        unlockErrorMsg.textContent = "حدث خطأ أثناء التحقق من الكود، حاول مرة أخرى.";
      } finally {
        confirmBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

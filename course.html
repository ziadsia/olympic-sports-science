<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محتوى الكورس - الأكاديمية الأولمبية لعلوم الرياضة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    :root {
      --bg-page: #f0f7ff;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-subtle: rgba(2, 132, 199, 0.16);
      --brand-primary: #0284c7;
    }

    html[data-theme="dark"],
    body.dark-mode,
    body.dark,
    html.dark {
      --bg-page: #0b1120;
      --bg-card: #131c31;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border-subtle: rgba(56, 189, 248, 0.22);
      --brand-primary: #38bdf8;
    }

    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      background-color: var(--bg-page) !important;
      color: var(--text-primary) !important;
    }

    .course-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 14px;
      background: var(--bg-card) !important;
      border: 1px solid var(--border-subtle);
    }

    .course-tab-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: inherit;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    .course-tab-btn.active {
      background: #0284c7;
      color: #ffffff !important;
    }

    .lesson-card {
      padding: 18px;
      border-radius: 14px;
      background: var(--bg-card) !important;
      border: 1px solid var(--border-subtle);
      margin-bottom: 18px;
    }

    /* حاوية الفيديو مع العلامة المائية والشريط السفلي */
    .video-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      background: #0f172a;
      margin: 12px 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .video-frame-wrap iframe,
    .video-frame-wrap video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
    }

    /* العلامة المائية المتحركة داخل الفيديو */
    .floating-watermark {
      position: absolute;
      top: 18%;
      right: 10%;
      z-index: 3;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.45);
      color: rgba(255, 255, 255, 0.78) !important;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      backdrop-filter: blur(2px);
      animation: watermarkDrift 14s ease-in-out infinite alternate;
    }

    @keyframes watermarkDrift {
      0%   { top: 12%; right: 8%; }
      25%  { top: 18%; right: 48%; }
      50%  { top: 52%; right: 42%; }
      75%  { top: 48%; right: 8%; }
      100% { top: 22%; right: 25%; }
    }

    /* شريط ثابت من الأسفل على الفيديو يوضح اسم الحساب والإيميل */
    .video-bottom-strip {
      position: absolute;
      bottom: 38px;
      left: 10px;
      right: 10px;
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.68);
      color: rgba(255, 255, 255, 0.88) !important;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .pdf-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: rgba(2, 132, 199, 0.04);
      margin-bottom: 12px;
    }

    .exam-box {
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card) !important;
      margin-bottom: 16px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body id="coursePageBody" style="display:none;">
  <header class="navbar">
    <div class="container nav-content">
      <a href="dashboard.html" class="brand">
        <img id="siteLogo" src="assets/img/logo.png" alt="شعار الأكاديمية" class="brand-logo" onerror="this.style.display='none'" />
        <span>الأكاديمية الأولمبية لعلوم الرياضة</span>
      </a>
      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-outline">العودة للكورسات</a>
        <button id="themeToggle" class="btn btn-icon" type="button" title="تبديل الوضع">🌙</button>
        <button id="logoutBtn" class="btn btn-primary" type="button">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="container section" style="padding-top: 28px;">
    <div class="card" style="margin-bottom: 20px; background: var(--bg-card) !important;">
      <span id="courseCategory" class="badge" style="margin-bottom: 8px;">علوم الرياضة</span>
      <h1 id="courseTitle" style="margin: 0 0 8px; color: var(--brand-primary) !important;">جاري تحميل الكورس...</h1>
      <p id="courseDescription" style="margin: 0; opacity: 0.85; line-height: 1.7;"></p>
    </div>

    <div class="course-tabs">
      <button class="course-tab-btn active" data-tab="videosTab" data-vis="videosSection" type="button">🎥 المحاضرات والفيديو</button>
      <button class="course-tab-btn" data-tab="pdfsTab" data-vis="pdfsSection" type="button">📄 ملفات PDF</button>
      <button class="course-tab-btn" data-tab="examsTab" data-vis="examsSection" type="button">📝 الامتحانات</button>
    </div>

    <section id="videosTab" class="course-panel" data-vis="videosSection">
      <div id="lessonsContainer">جاري تحميل المحاضرات...</div>
    </section>

    <section id="pdfsTab" class="course-panel" data-vis="pdfsSection" style="display:none;">
      <div id="pdfsContainer">جاري تحميل ملفات PDF...</div>
    </section>

    <section id="examsTab" class="course-panel" data-vis="examsSection" style="display:none;">
      <div id="examsContainer">جاري تحميل الامتحانات...</div>
    </section>
  </main>

  <script type="module">
    import { initTheme } from "./assets/js/theme.js";
    import { auth, db } from "./assets/js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      collection, getDocs, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    initTheme();

    const params = new URLSearchParams(location.search);
    const courseId = params.get("id");
    if (!courseId) location.href = "dashboard.html";

    let studentWatermarkInfo = {
      name: "طالب",
      email: ""
    };

    const logoEl = document.getElementById("siteLogo");
    try {
      const brandSnap = await getDoc(doc(db, "settings", "branding"));
      if (brandSnap.exists() && brandSnap.data().logoUrl) {
        logoEl.src = brandSnap.data().logoUrl;
        logoEl.style.display = "inline-block";
      }
    } catch (e) {}

    try {
      const visSnap = await getDoc(doc(db, "settings", "visibility"));
      if (visSnap.exists()) {
        const cfg = visSnap.data();
        document.querySelectorAll("[data-vis]").forEach((el) => {
          const key = el.getAttribute("data-vis");
          if (cfg[key] === false) el.style.display = "none";
        });
      }
    } catch (e) {}

    const tabBtns = document.querySelectorAll(".course-tab-btn");
    const panels = document.querySelectorAll(".course-panel");
    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        panels.forEach((p) => {
          p.style.display = p.id === btn.dataset.tab ? "block" : "none";
        });
      });
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.href = "auth.html";
    });

    function normalizeVideoEmbed(url) {
      if (!url) return "";
      const ytWatchMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if (ytWatchMatch) {
        return `https://www.youtube.com/embed/${ytWatchMatch[1]}`;
      }
      return url;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = "auth.html";
        return;
      }

      const userSnap = await getDoc(doc(db, "users", user.uid));
      const userData = userSnap.exists() ? userSnap.data() : {};
      const enrolled = Array.isArray(userData.enrolledCourses) ? userData.enrolledCourses : [];

      if (!enrolled.includes(courseId)) {
        location.href = "dashboard.html";
        return;
      }

      studentWatermarkInfo = {
        name: userData.fullName || user.email?.split("@")[0] || "طالب",
        email: user.email || ""
      };

      const courseSnap = await getDoc(doc(db, "courses", courseId));
      if (!courseSnap.exists()) {
        location.href = "dashboard.html";
        return;
      }

      const course = courseSnap.data();
      document.title = `${course.title || "الكورس"} - الأكاديمية الأولمبية لعلوم الرياضة`;
      document.getElementById("courseCategory").textContent = course.category || "علوم الرياضة";
      document.getElementById("courseTitle").textContent = course.title || "كورس";
      document.getElementById("courseDescription").textContent = course.description || "";
      document.getElementById("coursePageBody").style.display = "block";

      await Promise.all([loadLessons(), loadExams()]);
      enforceWatermarksProtection();
    });

    function enforceWatermarksProtection() {
      const labelText = `${studentWatermarkInfo.name} • ${studentWatermarkInfo.email}`;
      setInterval(() => {
        document.querySelectorAll(".floating-watermark").forEach((wm) => {
          wm.textContent = labelText;
          wm.style.display = "block";
          wm.style.opacity = "1";
          wm.style.visibility = "visible";
        });
        document.querySelectorAll(".video-bottom-strip").forEach((strip) => {
          strip.innerHTML = `<span>👤 ${studentWatermarkInfo.name}</span><span>✉️ ${studentWatermarkInfo.email}</span>`;
          strip.style.display = "flex";
          strip.style.opacity = "1";
          strip.style.visibility = "visible";
        });
      }, 1500);
    }

    async function loadLessons() {
      const lessonsContainer = document.getElementById("lessonsContainer");
      const pdfsContainer = document.getElementById("pdfsContainer");

      const snap = await getDocs(collection(db, "courses", courseId, "lessons"));
      const lessons = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

      if (!lessons.length) {
        lessonsContainer.innerHTML = `<div class="card"><p style="margin:0; opacity:0.75;">لا توجد محاضرات مضافة لهذا الكورس بعد.</p></div>`;
      } else {
        lessonsContainer.innerHTML = "";
        lessons.forEach((les) => {
          const embedUrl = normalizeVideoEmbed(les.videoUrl);
          const isDirectMp4 = /\.(mp4|webm|ogg)(\?|$)/i.test(embedUrl);

          const card = document.createElement("div");
          card.className = "lesson-card";
          card.innerHTML = `
            <h3 style="margin:0 0 8px;">${les.order || 1}. ${les.title || "محاضرة"}</h3>
            ${
              embedUrl
                ? `<div class="video-frame-wrap">
                    ${
                      isDirectMp4
                        ? `<video src="${embedUrl}" controls controlsList="nodownload"></video>`
                        : `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
                    }
                    <div class="floating-watermark">${studentWatermarkInfo.name} • ${studentWatermarkInfo.email}</div>
                    <div class="video-bottom-strip">
                      <span>👤 ${studentWatermarkInfo.name}</span>
                      <span>✉️ ${studentWatermarkInfo.email}</span>
                    </div>
                  </div>`
                : `<p style="opacity:0.7;">لا يوجد فيديو لهذه المحاضرة.</p>`
            }
            ${
              les.pdfUrl
                ? `<a href="${les.pdfUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">📄 فتح ملف PDF الخاص بالمحاضرة</a>`
                : ""
            }
          `;
          lessonsContainer.appendChild(card);
        });
      }

      const pdfs = lessons.filter((l) => l.pdfUrl && l.pdfUrl.trim());
      if (!pdfs.length) {
        pdfsContainer.innerHTML = `<div class="card"><p style="margin:0; opacity:0.75;">لا توجد ملفات PDF مضافة لهذا الكورس بعد.</p></div>`;
      } else {
        pdfsContainer.innerHTML = "";
        pdfs.forEach((item) => {
          const row = document.createElement("div");
          row.className = "pdf-item";
          row.innerHTML = `
            <div>
              <strong>📄 ${item.title || "ملف PDF"}</strong>
              <small style="display:block; opacity:0.75;">محاضرة رقم ${item.order || 1}</small>
            </div>
            <a href="${item.pdfUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">عرض / تحميل PDF</a>
          `;
          pdfsContainer.appendChild(row);
        });
      }
    }

    async function loadExams() {
      const container = document.getElementById("examsContainer");
      const snap = await getDocs(collection(db, "courses", courseId, "exams"));

      if (snap.empty) {
        container.innerHTML = `<div class="card"><p style="margin:0; opacity:0.75;">لا توجد امتحانات مضافة لهذا الكورس بعد.</p></div>`;
        return;
      }

      container.innerHTML = "";
      snap.forEach((docSnap, examIdx) => {
        const exam = docSnap.data();
        const questions = Array.isArray(exam.questions) ? exam.questions : [];
        const box = document.createElement("div");
        box.className = "exam-box";

        let qHtml = `<h3 style="margin:0 0 14px; color: var(--brand-primary) !important;">${exam.title || `امتحان ${examIdx + 1}`}</h3>`;

        questions.forEach((q, qIdx) => {
          const opts = Array.isArray(q.options) ? q.options : [];
          qHtml += `<div style="margin-bottom:14px;">
            <p style="font-weight:700; margin:0 0 8px;">${qIdx + 1}. ${q.question || ""}</p>
            ${opts.map((opt, oIdx) => `
              <label class="option-row">
                <input type="radio" name="exam_${examIdx}_q_${qIdx}" value="${oIdx}" />
                <span>${opt}</span>
              </label>
            `).join("")}
          </div>`;
        });

        qHtml += `
          <button type="button" class="btn btn-primary submit-exam-btn">تسليم الإجابات وعرض النتيجة</button>
          <p class="exam-result" style="margin-top:12px; font-weight:800; color: var(--brand-primary) !important;"></p>
        `;

        box.innerHTML = qHtml;

        box.querySelector(".submit-exam-btn").addEventListener("click", () => {
          let score = 0;
          questions.forEach((q, qIdx) => {
            const checked = box.querySelector(`input[name="exam_${examIdx}_q_${qIdx}"]:checked`);
            if (checked && Number(checked.value) === Number(q.correctIndex)) {
              score++;
            }
          });
          box.querySelector(".exam-result").textContent = `نتيجتك: ${score} من ${questions.length}`;
        });

        container.appendChild(box);
      });
    }
  </script>
</body>
</html>
